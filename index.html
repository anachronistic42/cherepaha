<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Подарок Черепахе</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            background: #fff;
            font-family: 'Georgia', 'Times New Roman', serif;
            overflow: hidden;
            position: relative;
        }

        /* ===== LOADING SCREEN ===== */
        #loadingScreen {
            position: fixed;
            inset: 0;
            z-index: 999999;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1.1s ease;
            font-family: 'Georgia', 'Times New Roman', serif;
            color: #222;
            text-align: center;
            padding: 20px;
        }
        #loadingScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loadingScreen .ls-title {
            display: flex;
            align-items: baseline;
            justify-content: center;
            flex-wrap: nowrap;
            width: 100%;
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: clamp(50px, 16.5vw, 250px);
            font-weight: 400;
            font-style: normal;
            letter-spacing: -0.005em;
            color: #111;
            line-height: 1;
            white-space: nowrap;
        }
        #loadingScreen .ls-float {
            display: inline-block;
            animation: lsFloat 3.8s ease-in-out infinite;
        }
        #loadingScreen .ls-title .ls-float:nth-child(1) { animation-delay: 0s; animation-duration: 3.6s; }
        #loadingScreen .ls-title .ls-float:nth-child(2) { animation-delay: 0.25s; animation-duration: 4.2s; }
        #loadingScreen .ls-title .ls-float:nth-child(3) { animation-delay: 0.5s; animation-duration: 3.3s; }
        #loadingScreen .ls-title .ls-float:nth-child(4) { animation-delay: 0.75s; animation-duration: 4s; }
        #loadingScreen .ls-title .ls-float:nth-child(5) { animation-delay: 1s; animation-duration: 3.5s; }
        #loadingScreen .ls-title .ls-float:nth-child(6) { animation-delay: 1.25s; animation-duration: 4.4s; }
        #loadingScreen .ls-title .ls-float:nth-child(7) { animation-delay: 1.5s; animation-duration: 3.7s; }
        @keyframes lsFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        #loadingScreen .ls-jump {
            display: inline-block;
            will-change: transform;
        }
        #loadingScreen .ls-title span.ls-letter {
            display: inline-block;
        }
        #loadingScreen .ls-o {
            position: relative;
            width: 0.62em;
            height: 0.62em;
            margin: 0 0.005em;
            transform: translateY(0.1em);
        }
        #loadingScreen .ls-o-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }
        #loadingScreen .ls-o-track {
            fill: none;
            stroke: rgba(0, 0, 0, 0.12);
            stroke-width: 17;
        }
        #loadingScreen .ls-o-fill {
            fill: none;
            stroke: #111;
            stroke-width: 17;
            stroke-linecap: round;
            stroke-dasharray: 263.9;
            stroke-dashoffset: 263.9;
            transform-box: fill-box;
            transform-origin: center;
            animation: lsSpin 1.9s linear infinite;
            transition: stroke-dashoffset 0.3s ease;
        }
        @keyframes lsSpin {
            to { transform: rotate(360deg); }
        }
        #loadingScreen .status {
            font-size: 14px;
            letter-spacing: 0.2em;
            font-weight: 400;
            opacity: 0.45;
            margin-top: 26px;
            text-transform: uppercase;
        }
        #loadingScreen .progress-squares {
            position: fixed;
            left: 50%;
            bottom: 42px;
            transform: translateX(-50%);
            display: flex;
            gap: 9px;
        }
        #loadingScreen .progress-squares .sq {
            width: 15px;
            height: 15px;
            background: rgba(0, 0, 0, 0.1);
            transition: background 0.25s ease;
            will-change: transform;
        }
        #loadingScreen .progress-squares .sq.filled {
            background: #111;
        }

        /* ===== TOP BAR ===== */
        #topBar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: #ffffff;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            z-index: 1000000;
            font-size: 18px;
            letter-spacing: 0.04em;
            transition: background 0.4s ease, border-color 0.4s ease, color 0.4s ease;
            pointer-events: none;
            color: #111;
        }
        #topBar.dark {
            background: #000000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        #topBar.dark .topBtn {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.25);
        }
        #topBar.dark .topBtn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.4);
        }
        #topBar>* {
            pointer-events: auto;
        }
        #topBar .title {
            font-weight: 600;
            font-size: 20px;
            letter-spacing: 0.08em;
            opacity: 0.7;
            cursor: pointer;
            user-select: none;
            transition: opacity 0.2s ease;
        }
        #topBar .title:hover {
            opacity: 1;
        }
        #topBar .rightBtns {
            display: flex;
            gap: 14px;
            align-items: center;
            flex-wrap: wrap;
        }
        .topBtn {
            background: transparent;
            border: 1px solid rgba(0, 0, 0, 0.12);
            border-radius: 40px;
            padding: 6px 18px;
            font-size: 13px;
            font-family: inherit;
            letter-spacing: 0.03em;
            cursor: pointer;
            transition: all 0.25s ease;
            color: #111;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            opacity: 0;
            pointer-events: none;
            transform: translateY(-4px);
            white-space: nowrap;
        }
        .topBtn.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
        .topBtn:hover {
            background: rgba(0, 0, 0, 0.06);
            border-color: rgba(0, 0, 0, 0.25);
            transform: scale(1.02);
        }
        #topBar.dark .topBtn {
            background: rgba(255, 255, 255, 0.05);
        }
        #topBar.dark .topBtn:hover {
            background: rgba(255, 255, 255, 0.14);
        }
        .topBtn.active {
            color: #fff;
            background: rgba(0, 0, 0, 0.75) !important;
            border-color: rgba(0, 0, 0, 0.75) !important;
        }
        #topBar.dark .topBtn.active {
            color: #000;
            background: rgba(255, 255, 255, 0.85) !important;
            border-color: rgba(255, 255, 255, 0.85) !important;
        }
        .topBtn.iconBtn {
            padding: 6px 12px;
            font-size: 16px;
            line-height: 1;
        }

        /* ===== PAGES ===== */
        .page {
            position: fixed;
            top: 56px;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: opacity 0.8s ease, transform 0.8s ease;
            opacity: 0;
            transform: scale(0.97);
            pointer-events: none;
            padding: 30px;
            overflow: hidden;
        }
        .page.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }
        .page.fade-out {
            opacity: 0;
            transform: scale(0.97);
            pointer-events: none;
        }

        /* ===== START PAGE ===== */
        #pageStart {
            background: #fff;
            text-align: center;
            justify-content: center;
            gap: 40px;
        }
        /* Вопрос и варианты ответов появляются с задержкой — сразу после
           экрана загрузки должен остаться просто белый фон, и только
           потом (медленно) проявиться вопрос. */
        #pageStart .question,
        #pageStart .options {
            opacity: 0;
            pointer-events: none;
            will-change: opacity;
            transition: opacity 2.4s ease-out;
        }
        #pageStart.content-visible .question,
        #pageStart.content-visible .options {
            opacity: 1;
            pointer-events: auto;
            transition: opacity 2.4s ease-out;
        }
        #pageStart .question {
            font-size: clamp(40px, 10vw, 86px);
            font-weight: 300;
            letter-spacing: 0.06em;
            color: #111;
            animation: floatText 4s ease-in-out infinite;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.02);
        }
        @keyframes floatText {
            0%,
            100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        .jitter-word {
            display: inline-block;
            animation: jitterWord 3.4s infinite steps(1);
        }
        @keyframes jitterWord {
            0%,
            89%,
            100% {
                transform: translate(0, 0);
                opacity: 1;
            }
            90% {
                transform: translate(-1px, 0.5px);
                opacity: 0.82;
            }
            90.5% {
                transform: translate(1px, -1px) skewX(1deg);
                opacity: 1;
            }
            91.2% {
                transform: translate(0, 0);
                opacity: 0.6;
            }
            91.6% {
                transform: translate(-0.5px, -0.5px);
                opacity: 1;
            }
            92.5% {
                transform: translate(0.5px, 0.5px) skewX(-1deg);
                opacity: 0.9;
            }
            93% {
                transform: translate(0, 0);
                opacity: 1;
            }
            96% {
                transform: translate(0.5px, -0.5px);
                opacity: 0.85;
            }
            96.4% {
                transform: translate(-0.5px, 0);
                opacity: 1;
            }
        }
        .options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 18px 32px;
            max-width: 700px;
        }
        .option {
            font-size: clamp(20px, 4vw, 36px);
            font-weight: 300;
            letter-spacing: 0.08em;
            color: #222;
            padding: 8px 24px;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
            background: rgba(0, 0, 0, 0.0);
            border: 1px solid transparent;
        }
        .option::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 24px;
            right: 24px;
            height: 1px;
            background: #111;
            transform: scaleX(0);
            transition: transform 0.4s ease;
            transform-origin: center;
        }
        .option:hover {
            transform: scale(1.06);
            color: #000;
            background: rgba(0, 0, 0, 0.03);
            border-color: rgba(0, 0, 0, 0.06);
        }
        .option:hover::after {
            transform: scaleX(1);
        }
        .option:active {
            transform: scale(0.94);
        }
        .option.removed {
            opacity: 0;
            transform: scale(0.8);
            pointer-events: none;
            transition: all 0.6s ease;
            width: 0;
            padding: 0;
            margin: 0;
            border: none;
            overflow: hidden;
        }
        .option.pulse {
            animation: optionPulse 0.5s ease;
        }
        @keyframes optionPulse {
            0% {
                transform: scale(1);
                background: rgba(0, 0, 0, 0.0);
            }
            35% {
                transform: scale(1.14);
                background: rgba(0, 0, 0, 0.08);
                color: #000;
            }
            100% {
                transform: scale(1);
                background: rgba(0, 0, 0, 0.0);
            }
        }

        /* ===== ABSTRACT PAGE ===== */
        #pageAbstract {
            background: #fff;
            padding: 0;
            top: 56px;
            overflow: hidden;
        }
        #pageAbstract canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
            background: #fff;
        }
        .abstract-text-overlay {
            position: fixed;
            top: 56px;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 10;
            padding: 40px;
            text-align: center;
            font-size: clamp(22px, 4vw, 48px);
            font-weight: 300;
            letter-spacing: 0.04em;
            color: #fff;
            text-shadow: 0 2px 40px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: opacity 0.8s ease;
            line-height: 1.5;
            max-width: 900px;
            margin: 0 auto;
        }
        .abstract-text-overlay.show {
            opacity: 1;
        }
        .abstract-text-overlay.dark-text {
            color: #111;
            text-shadow: 0 2px 40px rgba(255, 255, 255, 0.3);
        }
        #pageAbstract .click-hint {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            letter-spacing: 0.1em;
            pointer-events: none;
            z-index: 11;
            opacity: 0;
            transition: opacity 0.6s ease;
            font-weight: 300;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
        }
        #pageAbstract .click-hint.show {
            opacity: 1;
        }
        #pageAbstract .click-hint.dark {
            color: rgba(0, 0, 0, 0.2);
            text-shadow: none;
        }

        /* ===== STORY PAGE ===== */
        #pageStory {
            background: #fff;
            text-align: center;
            justify-content: center;
            gap: 30px;
            padding: 40px;
        }
        #pageStory .storyText {
            font-size: clamp(22px, 4.5vw, 48px);
            font-weight: 300;
            letter-spacing: 0.04em;
            color: #111;
            max-width: 860px;
            line-height: 1.5;
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.9s ease, transform 0.9s ease;
        }
        #pageStory .storyText.show {
            opacity: 1;
            transform: translateY(0);
        }
        #pageStory .storySquare {
            width: 70px;
            height: 70px;
            background: #111;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.4s ease;
            margin-top: 20px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.06);
        }
        #pageStory .storySquare:hover {
            transform: scale(1.06);
            box-shadow: 0 12px 56px rgba(0, 0, 0, 0.12);
        }
        #pageStory .storySquare:active {
            transform: scale(0.92);
        }
        #pageStory .storySquare.white {
            background: #fff;
            border: 2px solid #111;
        }

        /* ===== FINAL STORY ===== */
        #pageFinalStory {
            background: #000;
            color: #fff;
            text-align: left;
            padding: 50px 40px;
            overflow-y: auto;
            justify-content: flex-start;
            align-items: center;
        }
        #pageFinalStory .fs-content {
            max-width: 720px;
            margin: 0 auto;
            padding: 30px 0 60px;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1.2s ease, transform 1.2s ease;
        }
        #pageFinalStory .fs-content.show {
            opacity: 1;
            transform: translateY(0);
        }
        #pageFinalStory .fs-text {
            font-size: clamp(16px, 2.2vw, 26px);
            font-weight: 300;
            line-height: 1.8;
            letter-spacing: 0.03em;
            color: #eee;
            white-space: pre-wrap;
        }
        #pageFinalStory .fs-text p {
            margin-bottom: 1.2em;
        }
        #pageFinalStory .fs-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            left: 50%;
            width: 100vw;
            margin-left: -50vw;
            margin-right: -50vw;
            margin-top: 70px;
            min-height: 100vh;
            box-sizing: border-box;
            background: transparent;
            border: none;
            color: #fff;
            font-family: inherit;
            font-size: clamp(48px, 10vw, 150px);
            font-weight: 300;
            letter-spacing: 0.04em;
            line-height: 1.2;
            padding: 60px 30px;
            cursor: pointer;
            text-align: center;
            transition: transform 0.4s ease, opacity 0.4s ease;
        }
        #pageFinalStory .fs-btn:hover {
            transform: scale(1.03);
            opacity: 0.8;
        }
        #pageFinalStory .fs-btn:active {
            transform: scale(0.97);
        }

        /* ===== PUZZLE PAGES ===== */
        #pagePuzzle,
        #pageGiftPuzzle {
            background: #111;
            padding: 0;
            top: 56px;
            gap: 0;
        }
        #pagePuzzle .puzzle-canvas-wrap,
        #pageGiftPuzzle .puzzle-canvas-wrap {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: background 0.5s ease;
        }
        #pagePuzzle .puzzle-canvas-wrap:hover,
        #pageGiftPuzzle .puzzle-canvas-wrap:hover {
            background: #161616;
        }
        #pagePuzzle .puzzle-canvas-wrap canvas,
        #pageGiftPuzzle .puzzle-canvas-wrap canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #0a0a0a;
            border-radius: 0;
            box-shadow: none;
            cursor: grab;
            transform-origin: 0 0;
            touch-action: none;
            filter: brightness(1);
            transition: filter 0.4s ease;
        }
        #pagePuzzle .puzzle-canvas-wrap canvas:hover,
        #pageGiftPuzzle .puzzle-canvas-wrap canvas:hover {
            filter: brightness(1.12) saturate(1.08);
        }
        #pagePuzzle .puzzle-canvas-wrap canvas.panning,
        #pageGiftPuzzle .puzzle-canvas-wrap canvas.panning {
            cursor: grabbing;
        }
        #pagePuzzle .puzzle-pieces,
        #pageGiftPuzzle .puzzle-pieces {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 20;
            height: 130px;
            min-height: 100px;
            background: rgba(20, 20, 20, 0.18);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 12px 20px;
            flex-shrink: 0;
            transition: all 0.6s ease;
            overflow-x: auto;
        }
        #pagePuzzle .puzzle-pieces.hidden,
        #pageGiftPuzzle .puzzle-pieces.hidden {
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
            height: 0;
            min-height: 0;
            padding: 0;
            border: none;
            overflow: hidden;
        }
        .piece {
            width: 90px;
            height: 90px;
            flex-shrink: 0;
            border-radius: 0;
            cursor: grab;
            background: transparent;
            border: none;
            transition: transform 0.3s ease, filter 0.3s ease, opacity 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .piece img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 0;
            display: block;
            pointer-events: none;
            filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.5));
        }
        .piece.grey {
            filter: grayscale(1) brightness(0.4);
            cursor: not-allowed;
            opacity: 0.45;
        }
        .piece.available {
            cursor: grab;
            filter: none;
            opacity: 1;
        }
        .piece.available:hover {
            transform: scale(1.08);
        }
        .piece.available:hover img {
            filter: drop-shadow(0 6px 22px rgba(255, 255, 255, 0.35));
        }
        .piece.dragging {
            position: fixed;
            z-index: 1000;
            pointer-events: none;
            transform: scale(1.1) rotate(2deg);
            opacity: 0.95;
            width: 100px;
            height: 100px;
        }
        .piece.dragging img {
            filter: drop-shadow(0 10px 40px rgba(0, 0, 0, 0.7));
        }
        .piece.placed {
            opacity: 0;
            transform: scale(0.6);
            pointer-events: none;
            width: 0;
            height: 0;
            margin: 0;
            padding: 0;
            border: none;
            overflow: hidden;
            flex: 0 0 0;
            transition: none;
        }

        /* ===== GIFT PAGE ===== */
        #pageGift {
            background: #000;
            padding: 0;
            top: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #pageGift img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
            opacity: 0;
            transition: opacity 1.2s ease;
        }
        #pageGift img.show {
            opacity: 1;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            #topBar {
                padding: 0 14px;
                height: 48px;
                font-size: 15px;
            }
            #topBar .title {
                font-size: 16px;
            }
            .topBtn {
                font-size: 11px;
                padding: 4px 12px;
            }
            .page {
                top: 48px;
                padding: 16px;
            }
            #pageStart .question {
                font-size: clamp(30px, 12vw, 48px);
            }
            .options {
                gap: 10px 16px;
            }
            .option {
                font-size: clamp(18px, 5vw, 26px);
                padding: 6px 16px;
            }
            #pageStory .storyText {
                font-size: clamp(18px, 5vw, 28px);
            }
            #pageStory .storySquare {
                width: 52px;
                height: 52px;
            }
            #pageFinalStory {
                padding: 30px 18px;
            }
            #pageFinalStory .fs-text {
                font-size: clamp(14px, 3vw, 18px);
            }
            #pageFinalStory .fs-btn {
                font-size: clamp(32px, 12vw, 64px);
                padding: 40px 20px;
                margin-top: 40px;
                min-height: 100vh;
            }
            .piece {
                width: 60px;
                height: 60px;
            }
            #pagePuzzle .puzzle-pieces {
                height: 90px;
                min-height: 70px;
                gap: 12px;
                padding: 8px 12px;
            }
            .piece.dragging {
                width: 68px;
                height: 68px;
            }
            .abstract-text-overlay {

        const finalStoryText = `Однажды черепаха плыла в лодке по бескрайнему океану. Ну да, в лодке, в чём вообще проблема? Что черепахи не могут на лодке плавать? У неё ещё и фонарь был с собой с огоньком, чтобы греться. Ну да. Так и было. Так вот...

        // ============================================================
        //  LOADING SCREEN
        // ============================================================
        const loadingScreen = $('loadingScreen');
        const loadingStatus = $('loadingStatus');
        const loadingProgress = $('loadingProgress');
        const lsOFill1 = $('lsOFill1');
        const LS_CIRC = 263.9; // 2 * PI * 42
        const LS_SQUARES_COUNT = 12;

        // Экран загрузки держим минимум 5 секунд с самого начала —
        // так открытие выглядит красиво даже при мгновенной локальной загрузке.
        const MIN_LOADING_TIME = 5000;
        const loadingStartTime = performance.now();
        const loadState = { loaded: 0, total: 0 };
        let loadingActive = true;

        // создаём квадраты прогресс-бара
        (function buildLoadingSquares() {
            for (let i = 0; i < LS_SQUARES_COUNT; i++) {
                const sq = document.createElement('div');
                sq.className = 'sq ls-jump';
                loadingProgress.appendChild(sq);
            }
        })();
        const loadingSquares = loadingProgress.querySelectorAll('.sq');

        function renderLoadingPercent(percent) {
            const offset = LS_CIRC - (LS_CIRC * percent / 100);
            lsOFill1.style.strokeDashoffset = offset;
            loadingStatus.textContent = `${percent}%`;
            const filledCount = Math.round((percent / 100) * LS_SQUARES_COUNT);
            loadingSquares.forEach((sq, i) => {
                sq.classList.toggle('filled', i < filledCount);
            });
        }

        // Прогресс = минимум из "прошло времени" и "реально загружено".
        // Если грузить по факту нечего (кеш/локальный запуск), реальная доля
        // сразу равна 1, и заполнение идёт равномерно по времени все 5 секунд.
        // Если реальная загрузка вдруг длится дольше 5 секунд — прогресс
        // честно следует за ней, а не застревает на 100%.
        function loadingTick() {
            if (!loadingActive) return;
            const elapsed = performance.now() - loadingStartTime;
            const timeFraction = Math.min(1, elapsed / MIN_LOADING_TIME);
            const realFraction = loadState.total > 0 ? (loadState.loaded / loadState.total) : 1;
            const percent = Math.round(Math.min(timeFraction, realFraction) * 100);
            renderLoadingPercent(percent);
            requestAnimationFrame(loadingTick);
        }
        requestAnimationFrame(loadingTick);

        function hideLoading() {
            loadingActive = false;
            renderLoadingPercent(100);
            loadingScreen.classList.add('hidden');
            setTimeout(() => {
                loadingScreen.style.display = 'none';
            }, 1000);
        }

        // ============================================================
        //  БЕСКОНЕЧНЫЙ ЭКРАН ЗАГРУЗКИ
        //  (запускается кнопкой «К экрану загрузки» из верхней панели —
        //  кольцо и прогресс-бар заполняются, затем сбрасываются и
        //  заполняются заново, по кругу, и экран больше не скрывается)
        // ============================================================
        let infiniteLoadingActive = false;
        let infiniteLoadingRafId = null;
        const INFINITE_LOADING_CYCLE = 4000; // мс на один цикл заполнения

        function startInfiniteLoading() {
            if (infiniteLoadingActive) return; // уже крутится

            // на всякий случай останавливаем обычный (одноразовый) прогресс
            loadingActive = false;

            topBar.classList.remove('dark');
            loadingScreen.style.display = 'flex';
            loadingScreen.classList.remove('hidden');

            infiniteLoadingActive = true;
            const cycleStart = performance.now();

            function infiniteLoadingTick() {
                if (!infiniteLoadingActive) return;
                const elapsed = performance.now() - cycleStart;
                const fraction = (elapsed % INFINITE_LOADING_CYCLE) / INFINITE_LOADING_CYCLE;
                const percent = Math.round(fraction * 100);
                renderLoadingPercent(percent);
                infiniteLoadingRafId = requestAnimationFrame(infiniteLoadingTick);
            }
            infiniteLoadingRafId = requestAnimationFrame(infiniteLoadingTick);
        }

        function stopInfiniteLoading() {
            if (!infiniteLoadingActive) return;
            infiniteLoadingActive = false;
            if (infiniteLoadingRafId) {
                cancelAnimationFrame(infiniteLoadingRafId);
                infiniteLoadingRafId = null;
            }
            loadingScreen.classList.add('hidden');
            setTimeout(() => {
                loadingScreen.style.display = 'none';
            }, 1000);
        }

        // ============================================================
        //  LOADING SCREEN — элементы отпрыгивают от клика и возвращаются
        // ============================================================
        function lsRepel(x, y) {
            const targets = loadingScreen.querySelectorAll('.ls-jump');
            const maxRadius = 380;
            const maxPush = 85;
            targets.forEach((el) => {
                const rect = el.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                let dx = cx - x;
                let dy = cy - y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > maxRadius) return;
                if (dist < 1) { dx = (Math.random() - 0.5); dy = (Math.random() - 0.5); dist = 1; }
                const force = 1 - dist / maxRadius;
                const push = force * maxPush;
                const tx = (dx / dist) * push;
                const ty = (dy / dist) * push;
                el.style.transition = 'transform 0.16s cubic-bezier(.22,.85,.4,1)';
                el.style.transform = `translate(${tx}px, ${ty}px)`;
                clearTimeout(el._lsJumpTimeout);
                el._lsJumpTimeout = setTimeout(() => {
                    el.style.transition = 'transform 0.85s cubic-bezier(.34,1.56,.64,1)';
                    el.style.transform = 'translate(0, 0)';
                }, 90);
            });
        }
        loadingScreen.addEventListener('click', (e) => {
            lsRepel(e.clientX, e.clientY);
            playWoosh(0.04);
        });

            const imageList = [
                // Шош (кадры персонажа) — грузим первыми в приоритете,

                // (он спавнится сразу на DOMContentLoaded, ещё до
                // завершения предзагрузки остальных картинок).
                ...SHOSH_FRAME_NUMBERS.map(n => `media/shosh/shime${n}.png`),
                // puzzle steps (0–4)
                'media/step_0000.jpg',
                'media/step_0001.jpg',
                'media/step_0002.jpg',
                'media/step_0003.jpg',
                'media/step_0004.jpg',
                // puzzle pieces
                'media/peace_0000.png',
                'media/peace_0001.png',
                'media/peace_0002.png',
                'media/peace_0003.png',
                // gift puzzle steps (0–3)
                'media/cherepaha_step_0000.jpg',
                'media/cherepaha_step_0001.jpg',
                'media/cherepaha_step_0002.jpg',
                'media/cherepaha_step_0003.jpg',
                // gift puzzle pieces
                'media/cherepaha_peace_0000.png',
                'media/cherepaha_peace_0001.png',
                'media/cherepaha_peace_0002.png',
                // gift image
                'media/cherepaha_more.jpg',
            ];

            loadState.total = imageList.length;
            loadState.loaded = 0;

            return new Promise((resolve) => {
                if (loadState.total === 0) {
                    resolve();
                    return;
                }

                imageList.forEach((src) => {
                    const img = new Image();
                    img.onload = () => {
                        loadState.loaded++;
                        if (loadState.loaded === loadState.total) resolve();
                    };
                    img.onerror = () => {
                        // всё равно считаем загруженным, чтобы не зависнуть
                        loadState.loaded++;
                        if (loadState.loaded === loadState.total) resolve();
                    };
                    img.src = src;
                });
            });
        }

        function initAudio() {
            if (!state.audioCtx) {
                state.audioCtx = new(window.AudioContext || window.webkitAudioContext)();
            }
            if (state.audioCtx.state === 'suspended') {
                state.audioCtx.resume();
            }
        }

        let reverbNode = null;

        function getReverb() {
            const c = state.audioCtx;
            if (reverbNode && reverbNode._ctx === c) return reverbNode;
            const duration = 3.2;
            const decay = 3.2;
            const rate = c.sampleRate;
            const length = Math.floor(rate * duration);
            const impulse = c.createBuffer(2, length, rate);
            for (let ch = 0; ch < 2; ch++) {
                const data = impulse.getChannelData(ch);
                for (let i = 0; i < length; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
                }
            }
            const convolver = c.createConvolver();
            convolver.buffer = impulse;
            convolver._ctx = c;
            reverbNode = convolver;
            return convolver;
        }

        function routeSound(node, wet = 0.4) {
            const c = state.audioCtx;
            const dry = c.createGain();
            dry.gain.value = 1 - wet * 0.5;
            node.connect(dry);
            dry.connect(c.destination);
            const send = c.createGain();
            send.gain.value = wet;
            node.connect(send);
            send.connect(getReverb());
            getReverb().connect(c.destination);
        }

        function makeNoiseBuffer(c, dur, shape = 2) {
            const size = Math.max(1, Math.floor(c.sampleRate * dur));
            const buffer = c.createBuffer(1, size, c.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < size; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / size, shape);
            }
            return buffer;
        }

        function playSoftClick(volume = 0.07) {
            try {
                initAudio();
                const c = state.audioCtx;
                const t = c.currentTime;
                const out = c.createGain();
                out.gain.value = volume;
                const osc = c.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(210, t);
                osc.frequency.exponentialRampToValueAtTime(120, t + 0.22);
                const g = c.createGain();
                g.gain.setValueAtTime(0.0001, t);
                g.gain.exponentialRampToValueAtTime(1, t + 0.008);
                g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
                osc.connect(g);
                g.connect(out);
                const shimmer = c.createOscillator();
                shimmer.type = 'sine';
                shimmer.frequency.setValueAtTime(1480, t);
                const sg = c.createGain();
                sg.gain.setValueAtTime(0.0001, t);
                sg.gain.exponentialRampToValueAtTime(0.2, t + 0.006);
                sg.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
                shimmer.connect(sg);
                sg.connect(out);
                routeSound(out, 0.3);
                osc.start(t);
                osc.stop(t + 0.32);
                shimmer.start(t);
                shimmer.stop(t + 0.2);
            } catch (_) {}
        }

        function playDing(volume = 0.22) {
            try {
                initAudio();
                const c = state.audioCtx;
                const t = c.currentTime;
                const out = c.createGain();
                out.gain.value = volume;
                const partials = [
                    { f: 220.0, d: 0, amp: 0.7, dur: 2.4 },
                    { f: 329.6, d: 5, amp: 0.45, dur: 2.1 },
                    { f: 440.0, d: -6, amp: 0.32, dur: 1.9 },
                    { f: 659.3, d: 8, amp: 0.2, dur: 1.5 },
                    { f: 987.8, d: -10, amp: 0.12, dur: 1.1 },
                ];
                partials.forEach(p => {
                    const osc = c.createOscillator();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(p.f, t);
                    osc.detune.setValueAtTime(p.d, t);
                    const g = c.createGain();
                    g.gain.setValueAtTime(0.0001, t);
                    g.gain.exponentialRampToValueAtTime(p.amp, t + 0.03);
                    g.gain.exponentialRampToValueAtTime(0.0001, t + p.dur);
                    osc.connect(g);
                    g.connect(out);
                    osc.start(t);
                    osc.stop(t + p.dur + 0.05);
                });
                routeSound(out, 0.6);
            } catch (_) {}
        }

        function playDeepImpact(volume = 0.16) {
            try {
                initAudio();
                const c = state.audioCtx;
                const t = c.currentTime;
                const out = c.createGain();
                out.gain.value = volume;
                const sub = c.createOscillator();
                sub.type = 'sine';
                sub.frequency.setValueAtTime(65, t);
                sub.frequency.exponentialRampToValueAtTime(16, t + 1.1);
                const sg = c.createGain();
                sg.gain.setValueAtTime(1, t);
                sg.gain.exponentialRampToValueAtTime(0.0008, t + 1.3);
                sub.connect(sg);
                sg.connect(out);
                const growl = c.createOscillator();
                growl.type = 'sawtooth';
                growl.frequency.setValueAtTime(42, t);
                growl.frequency.exponentialRampToValueAtTime(13, t + 1.0);
                const gf = c.createBiquadFilter();
                gf.type = 'lowpass';
                gf.frequency.value = 260;
                const gg = c.createGain();
                gg.gain.setValueAtTime(0.45, t);
                gg.gain.exponentialRampToValueAtTime(0.0008, t + 1.1);
                growl.connect(gf);
                gf.connect(gg);
                gg.connect(out);
                const thud = c.createBufferSource();
                thud.buffer = makeNoiseBuffer(c, 0.35, 2.5);
                const tf = c.createBiquadFilter();
                tf.type = 'lowpass';
                tf.frequency.value = 450;
                const tg = c.createGain();
                tg.gain.value = 0.4;
                thud.connect(tf);
                tf.connect(tg);
                tg.connect(out);
                routeSound(out, 0.55);
                sub.start(t);
                sub.stop(t + 1.3);
                growl.start(t);
                growl.stop(t + 1.1);
                thud.start(t);
                thud.stop(t + 0.35);
            } catch (_) {}
        }

        function playWoosh(volume = 0.14) {
            try {
                initAudio();
                const c = state.audioCtx;
                const t = c.currentTime;
                const out = c.createGain();
                out.gain.value = volume;
                const noise = c.createBufferSource();
                noise.buffer = makeNoiseBuffer(c, 1.1, 1.5);
                const filter = c.createBiquadFilter();
                filter.type = 'bandpass';
                filter.Q.value = 0.7;
                filter.frequency.setValueAtTime(1100, t);
                filter.frequency.exponentialRampToValueAtTime(55, t + 1.0);
                const ng = c.createGain();
                ng.gain.setValueAtTime(0.0001, t);
                ng.gain.exponentialRampToValueAtTime(1, t + 0.2);
                ng.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
                noise.connect(filter);
                filter.connect(ng);
                ng.connect(out);
                const sub = c.createOscillator();
                sub.type = 'sine';
                sub.frequency.setValueAtTime(85, t);
                sub.frequency.exponentialRampToValueAtTime(24, t + 0.9);
                const sg2 = c.createGain();
                sg2.gain.setValueAtTime(0.6, t);
                sg2.gain.exponentialRampToValueAtTime(0.0008, t + 1.0);
                sub.connect(sg2);
                sg2.connect(out);
                routeSound(out, 0.5);
                noise.start(t);
                noise.stop(t + 1.1);
                sub.start(t);
                sub.stop(t + 1.0);
            } catch (_) {}
        }

        function playWaterSurge(volume = 0.16) {
            try {
                initAudio();
                const c = state.audioCtx;
                const t = c.currentTime;
                const out = c.createGain();
                out.gain.value = volume;
                const noise = c.createBufferSource();
                noise.buffer = makeNoiseBuffer(c, 1.6, 1.2);
                const filter = c.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(200, t);
                filter.frequency.linearRampToValueAtTime(1400, t + 0.5);
                filter.frequency.linearRampToValueAtTime(150, t + 1.5);
                filter.Q.value = 0.9;
                const ng = c.createGain();
                ng.gain.setValueAtTime(0.0001, t);
                ng.gain.exponentialRampToValueAtTime(1, t + 0.35);
                ng.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
                noise.connect(filter);
                filter.connect(ng);
                ng.connect(out);
                const lfo = c.createOscillator();
                lfo.type = 'sine';
                lfo.frequency.value = 3.2;
                const lfoGain = c.createGain();
                lfoGain.gain.value = 300;
                lfo.connect(lfoGain);
                lfoGain.connect(filter.frequency);
                routeSound(out, 0.6);
                noise.start(t);
                noise.stop(t + 1.6);
                lfo.start(t);
                lfo.stop(t + 1.6);
            } catch (_) {}
        }

        function scatterElementsFrom(elements, clickX, clickY, { power = 90, settleAfter = 260, duration = 480 } = {}) {
            elements.forEach(el => {
                const rect = el.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const dx = cx - clickX;
                const dy = cy - clickY;
                const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                const force = Math.min(power, (power * 90) / dist);
                const jitter = (Math.random() - 0.5) * 0.5;
                const ox = (dx / dist) * force + jitter * 10;
                const oy = (dy / dist) * force + jitter * 10;
                const rot = (Math.random() - 0.5) * 14;
                el.style.transition = `transform ${duration}ms cubic-bezier(.2,.8,.3,1)`;
                el.style.transform = `translate(${ox}px, ${oy}px) rotate(${rot}deg)`;
                setTimeout(() => {
                    el.style.transform = '';
                }, settleAfter);
            });
        }

        function resizeAbstractCanvas() {
            const rect = abstractCanvas.parentElement.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            abstractCanvas.width = rect.width * dpr;
            abstractCanvas.height = rect.height * dpr;
            abstractCanvas.style.width = rect.width + 'px';
            abstractCanvas.style.height = rect.height + 'px';
            ctx.scale(dpr, dpr);
            return { w: rect.width, h: rect.height };
        }

        function generateAbstractComposition(w, h, compositionIdx) {
            const shapes = [];
            const count = 40 + Math.floor(Math.random() * 30);
            let rng = compositionIdx * 137 + 42;
            const rand = (min, max) => {
                rng = (rng * 9301 + 49297) % 233280;
                return min + (rng / 233280) * (max - min);
            };

            const sqSize = Math.min(w, h) * (0.10 + rand(0.02, 0.07));
            const sqX = rand(sqSize, w - sqSize);
            const sqY = rand(sqSize, h - sqSize);
            abstractSquarePos = { x: sqX, y: sqY, w: sqSize, h: sqSize };

            shapes.push({
                type: 'rect',
                x: sqX,
                y: sqY,
                w: sqSize,
                h: sqSize,
                color: '#000',
                rotation: 0,
                vx: (rand(-0.15, 0.15)) * 0.15,
                vy: (rand(-0.15, 0.15)) * 0.15,
                isBlackSquare: true,
                size: sqSize,
                damping: 0.92,
            });

            const types = ['circle', 'rect', 'triangle', 'line'];
            for (let i = 0; i < count; i++) {
                const type = types[Math.floor(rand(0, types.length))];
                const color = rand(0, 1) > 0.5 ? '#000' : '#fff';
                const size = rand(8, Math.min(w, h) * 0.12);
                let x = rand(10, w - 10);
                let y = rand(10, h - 10);
                if (Math.abs(x - sqX) < sqSize * 0.9 && Math.abs(y - sqY) < sqSize * 0.9) {
                    x = rand(10, w - 10);
                    y = rand(10, h - 10);
                }
                const shape = {
                    type,
                    x,
                    y,
                    color,
                    rotation: rand(0, Math.PI * 2),
                    vx: (rand(-0.3, 0.3)) * 0.3,
                    vy: (rand(-0.3, 0.3)) * 0.3,
                    isBlackSquare: false,
                    damping: 0.999,
                };
                if (type === 'circle') {
                    shape.r = size * 0.5;
                    shape.size = size;
                } else if (type === 'rect') {
                    shape.w = size * (0.6 + rand(0.2, 0.8));
                    shape.h = size * (0.6 + rand(0.2, 0.8));
                    shape.size = size;
                } else if (type === 'triangle') {
                    shape.side = size;
                    shape.size = size;
                } else if (type === 'line') {
                    shape.len = size * (0.8 + rand(0.2, 1.2));
                    shape.thick = 1 + rand(0.5, 3);
                    shape.size = size;
                }
                shapes.push(shape);
            }
            return shapes;
        }

        function drawAbstractShapes(ctx, w, h, shapes, inverted) {
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = inverted ? '#000' : '#fff';
            ctx.fillRect(0, 0, w, h);
            const blackSquare = shapes.find(s => s.isBlackSquare);
            const others = shapes.filter(s => !s.isBlackSquare);
            others.forEach(s => drawShape(ctx, s, inverted));
            if (blackSquare) drawShape(ctx, blackSquare, inverted);
        }

        function drawShape(ctx, s, inverted) {
            const color = s.isBlackSquare ? (inverted ? '#fff' : '#000') :
                (s.color === '#000' ? (inverted ? '#fff' : '#000') :
                    (inverted ? '#000' : '#fff'));
            ctx.save();
            ctx.translate(s.x, s.y);
            ctx.rotate(s.rotation || 0);
            ctx.fillStyle = color;
            ctx.strokeStyle = color;
            ctx.lineWidth = s.thick || 1.5;
            if (s.type === 'circle') {
                ctx.beginPath();
                ctx.arc(0, 0, s.r || s.size * 0.5, 0, Math.PI * 2);
                ctx.fill();
            } else if (s.type === 'rect' || s.isBlackSquare) {
                const w = s.w || s.size;
                const h = s.h || s.size;
                ctx.fillRect(-w / 2, -h / 2, w, h);
                if (s.isBlackSquare) {
                    ctx.strokeStyle = inverted ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.08)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(-w / 2, -h / 2, w, h);
                }
            } else if (s.type === 'triangle') {
                const side = s.side || s.size;
                const h3 = side * Math.sqrt(3) / 2;
                ctx.beginPath();
                ctx.moveTo(0, -h3 * 0.6);
                ctx.lineTo(-side / 2, h3 * 0.4);
                ctx.lineTo(side / 2, h3 * 0.4);
                ctx.closePath();
                ctx.fill();
            } else if (s.type === 'line') {
                const len = s.len || s.size;
                ctx.beginPath();
                ctx.moveTo(-len / 2, 0);
                ctx.lineTo(len / 2, 0);
                ctx.stroke();
            }
            ctx.restore();
        }

        function updateAbstractShapes(shapes, w, h) {
            shapes.forEach(s => {
                s.x += s.vx || 0;
                s.y += s.vy || 0;
                const damp = s.damping || 0.999;
                s.vx = (s.vx || 0) * damp;
                s.vy = (s.vy || 0) * damp;
                if (Math.abs(s.vx) < 0.001) s.vx = 0;
                if (Math.abs(s.vy) < 0.001) s.vy = 0;
                if (s.x < 0) { s.x = 0;
                    s.vx = Math.abs(s.vx || 0) * 0.5; }
                if (s.x > w) { s.x = w;
                    s.vx = -Math.abs(s.vx || 0) * 0.5; }
                if (s.y < 0) { s.y = 0;
                    s.vy = Math.abs(s.vy || 0) * 0.5; }
                if (s.y > h) { s.y = h;
                    s.vy = -Math.abs(s.vy || 0) * 0.5; }
                if (s.rotation !== undefined) {
                    s.rotation += (Math.random() - 0.5) * 0.002;
                }
            });
        }

        function pushShapesAway(shapes, mx, my, w, h, impact) {
            const force = impact || 80;
            shapes.forEach(s => {
                const dx = s.x - mx;
                const dy = s.y - my;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 1) return;
                const strength = Math.max(0, 1 - dist / (w * 0.6));
                const f = strength * force;
                s.vx = (s.vx || 0) + (dx / dist) * f * 0.5;
                s.vy = (s.vy || 0) + (dy / dist) * f * 0.5;
                s.vx += (Math.random() - 0.5) * 0.5;
                s.vy += (Math.random() - 0.5) * 0.5;
            });
        }

        function getBlackSquareCurrentPos(shapes) {
            return shapes.find(s => s.isBlackSquare);
        }

        let abstractRunning = false;

        function initAbstractArt() {
            if (abstractRunning) return;
            abstractRunning = true;

            abstractShapes = generateAbstractComposition(w, h, state.abstractComposition);
            drawAbstractShapes(ctx, w, h, abstractShapes, false);
            if (abstractAnimId) cancelAnimationFrame(abstractAnimId);

            function animate() {
                const rect2 = abstractCanvas.parentElement.getBoundingClientRect();
                const w2 = rect2.width;
                const h2 = rect2.height;
                if (w2 !== abstractCanvas.width / (window.devicePixelRatio || 1) ||
                    h2 !== abstractCanvas.height / (window.devicePixelRatio || 1)) {
                    resizeAbstractCanvas();
                }
                updateAbstractShapes(abstractShapes, w2, h2);
                drawAbstractShapes(ctx, w2, h2, abstractShapes, abstractIsInverted);
                abstractAnimId = requestAnimationFrame(animate);
            }
            animate();
            window._abstractAnimId = abstractAnimId;
            window._abstractShapes = abstractShapes;
        }

        abstractCanvas.addEventListener('click', (e) => {
            if (state.page !== 'abstract') return;
            const rect = abstractCanvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            const mx = (e.clientX - rect.left) * (rect.width / (rect.width * dpr));
            const my = (e.clientY - rect.top) * (rect.height / (rect.height * dpr));
            const w = rect.width;
            const h = rect.height;

            if (state.isAbstractTextMode) {
                const sq = getBlackSquareCurrentPos(abstractShapes);
                if (sq) {
                    const scaleX = rect.width / (abstractCanvas.width / dpr);
                    const scaleY = rect.height / (abstractCanvas.height / dpr);
                    const sx = sq.x * scaleX;
                    const sy = sq.y * scaleY;
                    const sw = sq.w * scaleX;
                    const sh = sq.h * scaleY;
                    if (mx >= sx - sw / 2 && mx <= sx + sw / 2 &&
                        my >= sy - sh / 2 && my <= sy + sh / 2) {
                        playSoftClick();
                        advanceAbstractText();
                        return;
                    }
                }
                pushShapesAway(abstractShapes, mx, my, w, h, 60);
                playWoosh(0.04);

            if (!abstractIsInverted) {
                const sq = getBlackSquareCurrentPos(abstractShapes);
                if (sq) {
                    const scaleX = rect.width / (abstractCanvas.width / dpr);
                    const scaleY = rect.height / (abstractCanvas.height / dpr);
                    const sx = sq.x * scaleX;
                    const sy = sq.y * scaleY;
                    const sw = sq.w * scaleX;
                    const sh = sq.h * scaleY;
                    if (mx >= sx - sw / 2 && mx <= sx + sw / 2 &&
                        my >= sy - sh / 2 && my <= sy + sh / 2) {
                        playDeepImpact(0.18);
                        state.abstractClickCount++;

                            document.body.appendChild(flash);
                            setTimeout(() => { flash.style.opacity = '0';
                                setTimeout(() => flash.remove(), 400); }, 200);
                            setTimeout(() => {
                                state.isAbstractTextMode = true;
                                state.abstractTextIndex = 0;
                                showAbstractTextLine();
                                abstractHint.textContent = '';
                                abstractHint.classList.add('show');
                                abstractHint.classList.remove('dark');
                            }, 500);
                        } else {
                            state.abstractComposition++;
                            const rect2 = abstractCanvas.parentElement.getBoundingClientRect();
                            const w2 = rect2.width;
                            const h2 = rect2.height;
                            abstractShapes = generateAbstractComposition(w2, h2, state.abstractComposition);
                            drawAbstractShapes(ctx, w2, h2, abstractShapes, false);
                            playWoosh(0.12);
                            const flash2 = document.createElement('div');
                            flash2.style.cssText =
                                'position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;z-index:9999;pointer-events:none;transition:opacity 0.2s ease;opacity:0.25;';
                            document.body.appendChild(flash2);
                            setTimeout(() => { flash2.style.opacity = '0';
                                setTimeout(() => flash2.remove(), 300); }, 150);
                        }
                        return;
                    }
                }
            }

            if (!abstractIsInverted) {
                playWoosh(0.05);
                pushShapesAway(abstractShapes, mx, my, w, h, 100);
            } else {
                pushShapesAway(abstractShapes, mx, my, w, h, 50);
                playWoosh(0.03);
            }
        });

        function waveTransitionOverlay(callback, { riseDuration = 700, hold = 150, fallDuration = 750 } = {}) {
            const canvas = document.createElement('canvas');
            canvas.style.cssText = 'position:fixed;inset:0;z-index:99999;pointer-events:none;width:100%;height:100%;';
            document.body.appendChild(canvas);
            const wctx = canvas.getContext('2d');

            function resize() {
                const dpr = window.devicePixelRatio || 1;
                canvas.width = window.innerWidth * dpr;
                canvas.height = window.innerHeight * dpr;
                canvas.style.width = window.innerWidth + 'px';
                canvas.style.height = window.innerHeight + 'px';
                wctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            resize();
            window.addEventListener('resize', resize);

            const layers = [
                { amp: 24, freq: 0.011, speed: 0.0026, color: 'rgba(6, 24, 36, 0.97)' },
                { amp: 17, freq: 0.017, speed: 0.0036, color: 'rgba(11, 42, 58, 0.92)' },
                { amp: 12, freq: 0.026, speed: 0.0048, color: 'rgba(18, 66, 86, 0.86)' },
            ];

            function drawWaves(levelFrac, t) {
                const W = window.innerWidth,
                    H = window.innerHeight;
                wctx.clearRect(0, 0, W, H);
                const baseY = H * (1 - levelFrac);
                layers.forEach((layer, li) => {
                    wctx.beginPath();
                    wctx.moveTo(0, H + 2);
                    for (let x = 0; x <= W; x += 10) {
                        const y = baseY - li * 8 * levelFrac +
                            Math.sin(x * layer.freq + t * layer.speed) * layer.amp * levelFrac;
                        wctx.lineTo(x, y);
                    }
                    wctx.lineTo(W, H + 2);
                    wctx.closePath();
                    wctx.fillStyle = layer.color;
                    wctx.fill();
                });
            }

            const start = performance.now();
            let switched = false;

            function frame(now) {
                const t = now - start;
                let levelFrac;
                if (t < riseDuration) {
                    levelFrac = t / riseDuration;
                } else if (t < riseDuration + hold) {
                    levelFrac = 1;
                    if (!switched) {
                        switched = true;
                        callback();
                    }
                } else if (t < riseDuration + hold + fallDuration) {
                    levelFrac = 1 - (t - riseDuration - hold) / fallDuration;
                } else {
                    levelFrac = 0;
                }
                drawWaves(Math.max(0, Math.min(1, levelFrac)), t);
                if (t < riseDuration + hold + fallDuration) {
                    requestAnimationFrame(frame);
                } else {
                    window.removeEventListener('resize', resize);
                    canvas.remove();
                }
            }
            requestAnimationFrame(frame);
        }

        function splitIntoLetterSpans(root) {
            const spans = [];

            function walk(node) {
                if (node.nodeType === Node.TEXT_NODE) {
                    const text = node.textContent;
                    if (!text) return;
                    const frag = document.createDocumentFragment();
                    for (const ch of text) {
                        const span = document.createElement('span');
                        span.textContent = ch === ' ' ? '\u00A0' : ch;
                        span.style.display = 'inline-block';
                        frag.appendChild(span);
                        spans.push(span);
                    }
                    node.parentNode.replaceChild(frag, node);
                } else if (node.nodeType === Node.ELEMENT_NODE) {
                    Array.from(node.childNodes).forEach(walk);
                }
            }
            Array.from(root.childNodes).forEach(walk);
            return spans;
        }

        function sizeCanvasToWrap(canvas) {
            const wrap = canvas.parentElement;
            const rect = wrap.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = Math.max(1, Math.round(rect.width * dpr));
            canvas.height = Math.max(1, Math.round(rect.height * dpr));

        function drawPuzzleImageCover(canvas, ctx, img) {
            const { w, h, dpr } = sizeCanvasToWrap(canvas);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, w, h);
            const scale = Math.max(w / img.width, h / img.height);
            const iw = img.width * scale;
            const ih = img.height * scale;
            const ix = (w - iw) / 2;
            const iy = (h - ih) / 2;
            ctx.drawImage(img, ix, iy, iw, ih);
        }

        function drawPuzzleFallback(canvas, ctx, step) {
            const { w, h, dpr } = sizeCanvasToWrap(canvas);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = '#444';
            ctx.font = `${Math.min(w, h) * 0.05}px Georgia, serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(`шаг ${step + 1}`, w / 2, h / 2);
        }

        function rippleRevealImage(canvas, ctx, img, duration = 900) {
            const { w, h, dpr } = sizeCanvasToWrap(canvas);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            const off = document.createElement('canvas');
            off.width = Math.max(1, Math.round(w));
            off.height = Math.max(1, Math.round(h));
            const octx = off.getContext('2d');
            const scale = Math.max(w / img.width, h / img.height);
            const iw = img.width * scale;
            const ih = img.height * scale;
            const ix = (w - iw) / 2;
            const iy = (h - ih) / 2;
            octx.fillStyle = '#0a0a0a';
            octx.fillRect(0, 0, off.width, off.height);
            octx.drawImage(img, ix, iy, iw, ih);
            let srcData;
            try {
                srcData = octx.getImageData(0, 0, off.width, off.height);
            } catch (_) {
                drawPuzzleImageCover(canvas, ctx, img);
                return;
            }
            const src = srcData.data;
            const outData = octx.createImageData(off.width, off.height);
            const out = outData.data;
            const cx = off.width / 2;
            const cy = off.height / 2;
            const maxR = Math.sqrt(cx * cx + cy * cy) || 1;
            const start = performance.now();
            const step = 2;

            function frame(now) {
                const t = now - start;
                const progress = Math.min(1, t / duration);
                const amp = 20 * (1 - progress) * (1 - progress);
                const waveFreq = 0.05;
                const timeShift = t * 0.02;
                for (let y = 0; y < off.height; y += step) {
                    for (let x = 0; x < off.width; x += step) {
                        const dx = x - cx,
                            dy = y - cy;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const ripple = Math.sin(dist * waveFreq - timeShift) * amp * (1 - dist / maxR);
                        const angle = Math.atan2(dy, dx);
                        let sx = Math.round(x + Math.cos(angle) * ripple);
                        let sy = Math.round(y + Math.sin(angle) * ripple);
                        if (sx < 0) sx = 0;
                        else if (sx >= off.width) sx = off.width - 1;
                        if (sy < 0) sy = 0;
                        else if (sy >= off.height) sy = off.height - 1;
                        const srcIdx = (sy * off.width + sx) * 4;
                        for (let by = 0; by < step && y + by < off.height; by++) {
                            for (let bx = 0; bx < step && x + bx < off.width; bx++) {
                                const outIdx = ((y + by) * off.width + (x + bx)) * 4;
                                out[outIdx] = src[srcIdx];
                                out[outIdx + 1] = src[srcIdx + 1];
                                out[outIdx + 2] = src[srcIdx + 2];
                                out[outIdx + 3] = src[srcIdx + 3];
                            }
                        }
                    }
                }
                octx.putImageData(outData, 0, 0);
                ctx.clearRect(0, 0, w, h);
                ctx.drawImage(off, 0, 0, w, h);
                if (progress < 1) {
                    requestAnimationFrame(frame);
                } else {
                    drawPuzzleImageCover(canvas, ctx, img);
                }
            }
            requestAnimationFrame(frame);
        }

        function createZoomPan(canvas) {
            let scale = 1,
                tx = 0,
                ty = 0;
            const minScale = 1,
                maxScale = 5;

            function apply() {
                canvas.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
            }

            function clampAtBase() {
                if (scale <= 1) {
                    scale = 1;
                    tx = 0;
                    ty = 0;
                }
            }

            function reset() {
                scale = 1;
                tx = 0;
                ty = 0;
                apply();
            }

            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;
                const prevScale = scale;
                const zoomFactor = Math.exp(-e.deltaY * 0.0015);
                let newScale = prevScale * zoomFactor;
                newScale = Math.min(maxScale, Math.max(minScale, newScale));
                if (newScale === prevScale) return;
                const ratio = newScale / prevScale;
                tx = mx - ratio * (mx - tx);
                ty = my - ratio * (my - ty);
                scale = newScale;
                clampAtBase();
                apply();
            }, { passive: false });

            let panning = false,
                panStartX = 0,
                panStartY = 0,
                startTx = 0,
                startTy = 0;
            canvas.addEventListener('mousedown', (e) => {
                if (e.button !== 0 && e.button !== 1) return;
                e.preventDefault();
                panning = true;
                panStartX = e.clientX;
                panStartY = e.clientY;
                startTx = tx;
                startTy = ty;
                canvas.classList.add('panning');
            });
            window.addEventListener('mousemove', (e) => {
                if (!panning) return;
                tx = startTx + (e.clientX - panStartX);
                ty = startTy + (e.clientY - panStartY);
                apply();
            });
            window.addEventListener('mouseup', (e) => {
                if ((e.button !== 0 && e.button !== 1) || !panning) return;
                panning = false;
                canvas.classList.remove('panning');
            });
            canvas.addEventListener('auxclick', (e) => {
                if (e.button === 1) e.preventDefault();
            });

            apply();
            return { reset };
        }
