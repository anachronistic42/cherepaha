        // ============================================================
        //  LIQUID GLASS CURSOR — WATER SIMULATION
        //  (Params are now live-adjustable via the settings menu)
        // ============================================================

        function clampByte(v) { return v < 0 ? 0 : v > 255 ? 255 : v | 0; }

        function makeHeightCanvas(size) {
            const c = document.createElement('canvas');
            c.width = size;
            c.height = size;
            return { canvas: c, ctx: c.getContext('2d') };
        }

        function writeWaterImage(height, gw, gh, canvas, ctx, edgeFade) {
            let maxH = 0;
            for (let i = 0; i < height.length; i++) {
                const a = Math.abs(height[i]);
                if (a > maxH) maxH = a;
            }
            if (maxH < 0.04) return null;

            const norm = 92 / maxH;
            const img = ctx.createImageData(gw, gh);
            const data = img.data;
            for (let y = 0; y < gh; y++) {
                const y0 = y > 0 ? y - 1 : 0,
                    y1 = y < gh - 1 ? y + 1 : gh - 1;
                for (let x = 0; x < gw; x++) {
                    const x0 = x > 0 ? x - 1 : 0,
                        x1 = x < gw - 1 ? x + 1 : gw - 1;
                    const i = y * gw + x;
                    const fade = edgeFade ? edgeFade(x, y) : 1;
                    const dx = (height[y * gw + x1] - height[y * gw + x0]) * norm * fade;
                    const dy = (height[y1 * gw + x] - height[y0 * gw + x]) * norm * fade;
                    const hh = height[i] * norm * fade;
                    const idx = i * 4;
                    data[idx] = clampByte(128 + dx);
                    data[idx + 1] = clampByte(128 + dy);
                    data[idx + 2] = clampByte(128 + hh);
                    data[idx + 3] = 255;
                }
            }
            ctx.putImageData(img, 0, 0);
            return canvas.toDataURL();
        }

        function stepWater(cur, prev, w, h, damping) {
            for (let y = 1; y < h - 1; y++) {
                const row = y * w,
                    rowUp = row - w,
                    rowDown = row + w;
                for (let x = 1; x < w - 1; x++) {
                    const i = row + x;
                    prev[i] = ((cur[i - 1] + cur[i + 1] + cur[rowUp + x] + cur[rowDown + x]) * 0.5 - prev[i]) * damping;
                }
            }
        }

        function splatWater(buf, w, h, gx, gy, strength, radius) {
            const x0 = Math.max(1, Math.floor(gx - radius)),
                x1 = Math.min(w - 2, Math.ceil(gx + radius));
            const y0 = Math.max(1, Math.floor(gy - radius)),
                y1 = Math.min(h - 2, Math.ceil(gy + radius));
            for (let y = y0; y <= y1; y++) {
                for (let x = x0; x <= x1; x++) {
                    const d = Math.hypot(x - gx, y - gy) / radius;
                    if (d > 1) continue;
                    const falloff = Math.cos(d * Math.PI * 0.5);
                    buf[y * w + x] += strength * falloff * falloff;
                }
            }
        }

        // --- water settings (live) ---
        const waterSettings = {
            gridSize: 64,
            damping: 0.982,
            displaceScale: 46,
            strength: 16,
            radius: 5.5,
            fieldSize: 450,
            opacity: 0.94,
        };

        let waterW = waterSettings.gridSize;
        let waterH = waterSettings.gridSize;
        let waterCur = new Float32Array(waterW * waterH);
        let waterPrev = new Float32Array(waterW * waterH);
        let WATER_DAMPING = waterSettings.damping;
        let WATER_DISPLACE_SCALE = waterSettings.displaceScale;

        function waterEdgeFade(x, y) {
            const cx = (waterW - 1) / 2,
                cy = (waterH - 1) / 2;
            const maxR = Math.min(cx, cy);
            const r = Math.hypot(x - cx, y - cy) / maxR;
            if (r >= 1) return 0;
            return r > 0.7 ? Math.max(0, 1 - (r - 0.7) / 0.3) : 1;
        }

        function getWaterFieldSize() {
            return Math.max(200, Math.min(700, window.innerWidth * 0.62, window.innerHeight * 0.62));
        }
        let waterFieldSize = waterSettings.fieldSize;
        document.documentElement.style.setProperty('--water-size', waterFieldSize + 'px');

        const { canvas: waterCanvas, ctx: waterCtx } = makeHeightCanvas(waterW);
        const waterMapImage = document.getElementById('waterMapImage');
        let waterMapIsFlat = true;

        const waterFieldWrap = document.createElement('div');
        waterFieldWrap.id = 'waterFieldWrap';
        const waterField = document.createElement('div');
        waterField.id = 'waterField';
        waterFieldWrap.appendChild(waterField);
        document.body.appendChild(waterFieldWrap);

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let fieldX = mouseX,
            fieldY = mouseY;
        let waterActive = false;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            waterActive = true;
        });
        document.addEventListener('touchmove', (e) => {
            if (e.touches && e.touches[0]) {
                mouseX = e.touches[0].clientX;
                mouseY = e.touches[0].clientY;
                waterActive = true;
            }
        }, { passive: true });

        function pressWater(px, py, power) {
            const gx = ((px - fieldX) / waterFieldSize + 0.5) * waterW;
            const gy = ((py - fieldY) / waterFieldSize + 0.5) * waterH;
            splatWater(waterCur, waterW, waterH, gx, gy, -waterSettings.strength * power, waterSettings.radius);
        }
        document.addEventListener('mousedown', (e) => {
            waterField.classList.add('pressed');
            waterActive = true;
            pressWater(e.clientX, e.clientY, 1);
        });
        document.addEventListener('mouseup', () => waterField.classList.remove('pressed'));
        document.addEventListener('touchstart', (e) => {
            if (e.touches && e.touches[0]) {
                waterActive = true;
                pressWater(e.touches[0].clientX, e.touches[0].clientY, 1);
            }
        }, { passive: true });

        function setCursorGooTheme(isDark) {
            waterField.classList.toggle('light-bg', !isDark);
        }

        window.addEventListener('resize', () => {
            waterFieldSize = Math.max(200, Math.min(700, window.innerWidth * 0.62, window.innerHeight * 0.62));
            document.documentElement.style.setProperty('--water-size', waterFieldSize + 'px');
        });

        const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        let waterMapFrame = 0;

        function animateWater() {
            const ease = 0.22;
            fieldX += (mouseX - fieldX) * ease;
            fieldY += (mouseY - fieldY) * ease;
            waterFieldWrap.style.transform = `translate(${fieldX}px, ${fieldY}px)`;

            const vx = mouseX - fieldX,
                vy = mouseY - fieldY;
            const speed = Math.min(Math.hypot(vx, vy), 60);
            if (waterActive && speed > 0.6) {
                const gx = waterW / 2 + (vx / waterFieldSize) * waterW;
                const gy = waterH / 2 + (vy / waterFieldSize) * waterH;
                const moveStrength = Math.min(speed * 0.16 * (waterSettings.strength / 16), 7 * (waterSettings.strength /
                16));
                const moveRadius = waterSettings.radius * 0.58;
                splatWater(waterCur, waterW, waterH, gx, gy, -moveStrength, moveRadius);
            }

            stepWater(waterCur, waterPrev, waterW, waterH, WATER_DAMPING);
            const tmp = waterCur;
            waterCur = waterPrev;
            waterPrev = tmp;

            waterMapFrame++;
            if (waterMapFrame % 2 === 0) {
                const url = writeWaterImage(waterCur, waterW, waterH, waterCanvas, waterCtx, waterEdgeFade);
                if (url) {
                    waterMapImage.setAttribute('href', url);
                    waterMapIsFlat = false;
                } else if (!waterMapIsFlat) {
                    waterMapImage.removeAttribute('href');
                    waterMapIsFlat = true;
                }
            }

            requestAnimationFrame(animateWater);
        }
        if (!reduceMotion) requestAnimationFrame(animateWater);

        // --- apply settings to SVG filter ---
        function updateDisplaceScale(scale) {
            WATER_DISPLACE_SCALE = scale;
            const disp = document.getElementById('waterDisplace');
            if (disp) disp.setAttribute('scale', String(scale));
        }

        // --- reinitialize water grid ---
        function reinitWaterGrid(size) {
            waterW = Math.max(16, Math.round(size));
            waterH = waterW;
            waterCur = new Float32Array(waterW * waterH);
            waterPrev = new Float32Array(waterW * waterH);
            // also update the canvas used for rendering
            const c = document.createElement('canvas');
            c.width = waterW;
            c.height = waterH;
            // replace the old one
            const oldCanvas = waterCanvas;
            const oldCtx = waterCtx;
            // can't easily replace the ctx, so we just keep using the same one
            // but resize the canvas
            waterCanvas.width = waterW;
            waterCanvas.height = waterH;
            // also update the filter's feImage to match
            waterMapIsFlat = false;
            // force a redraw
            const url = writeWaterImage(waterCur, waterW, waterH, waterCanvas, waterCtx, waterEdgeFade);
            if (url) {
                waterMapImage.setAttribute('href', url);
                waterMapIsFlat = false;
            }
        }

        // ============================================================
        //  SETTINGS MENU — Alt+Q / Alt+Й
        // ============================================================
        const settingsOverlay = document.getElementById('settingsOverlay');
        const settingsClose = document.getElementById('settingsClose');
        const settingsCloseBtn = document.getElementById('settingsCloseBtn');
        const settingsReset = document.getElementById('settingsReset');

        const setGrid = document.getElementById('setGrid');
        const setDamping = document.getElementById('setDamping');
        const setScale = document.getElementById('setScale');
        const setStrength = document.getElementById('setStrength');
        const setRadius = document.getElementById('setRadius');
        const setFieldSize = document.getElementById('setFieldSize');
        const setOpacity = document.getElementById('setOpacity');

        const valGrid = document.getElementById('valGrid');
        const valDamping = document.getElementById('valDamping');
        const valScale = document.getElementById('valScale');
        const valStrength = document.getElementById('valStrength');
        const valRadius = document.getElementById('valRadius');
        const valFieldSize = document.getElementById('valFieldSize');
        const valOpacity = document.getElementById('valOpacity');

        let settingsOpen = false;

        function toggleSettings(open) {
            settingsOpen = (open !== undefined) ? open : !settingsOpen;
            settingsOverlay.classList.toggle('open', settingsOpen);
            if (settingsOpen) {
                // sync UI with current settings
                setGrid.value = waterSettings.gridSize;

                valScale.textContent = waterSettings.displaceScale;
                setStrength.value = waterSettings.strength;

                setRadius.value = waterSettings.radius;
                valRadius.textContent = waterSettings.radius;
                setFieldSize.value = waterSettings.fieldSize;
                valFieldSize.textContent = waterSettings.fieldSize;
                setOpacity.value = Math.round(waterSettings.opacity * 100);
                valOpacity.textContent = waterSettings.opacity.toFixed(2);

        function closeSettings() { if (settingsOpen) toggleSettings(false); }

        // keyboard: Alt+Q / Alt+Й
        document.addEventListener('keydown', (e) => {

        // --- sliders ---

        }

        setGrid.addEventListener('input', () => {

        // --- reset ---
        settingsReset.addEventListener('click', () => {
            const defaults = { gridSize: 64, damping: 0.982, displaceScale: 46, strength: 16, radius: 5.5,
                fieldSize: 450, opacity: 0.94 };
            Object.assign(waterSettings, defaults);

            setGrid.value = defaults.gridSize;
            valGrid.textContent = defaults.gridSize;
            setDamping.value = 982;
            valDamping.textContent = '0.982';
            setScale.value = defaults.displaceScale;
            valScale.textContent = defaults.displaceScale;
            setStrength.value = defaults.strength;
            valStrength.textContent = defaults.strength;
            setRadius.value = defaults.radius;
            valRadius.textContent = defaults.radius;
            setFieldSize.value = defaults.fieldSize;
            valFieldSize.textContent = defaults.fieldSize;
            setOpacity.value = 94;
            valOpacity.textContent = '0.94';

            WATER_DAMPING = defaults.damping;
            updateDisplaceScale(defaults.displaceScale);
            waterFieldSize = defaults.fieldSize;
            document.documentElement.style.setProperty('--water-size', defaults.fieldSize + 'px');
            waterField.style.opacity = defaults.opacity;
            reinitWaterGrid(defaults.gridSize);
            playSoftClick();
        });

        // --- transient "drop" ripples ---
        const svgns = 'http://www.w3.org/2000/svg';
        const globalSvgDefs = document.getElementById('globalSvgDefs');
        let dropFilterCounter = 0;

        function spawnWaterMorphBurst(x, y) {
            if (reduceMotion) return;
            const grid = 64;
            const boxSize = 300;
            const id = 'waterDrop' + (dropFilterCounter++);
            const { canvas, ctx } = makeHeightCanvas(grid);

            const filter = document.createElementNS(svgns, 'filter');
            filter.setAttribute('id', id);
            filter.setAttribute('x', '-60%');
            filter.setAttribute('y', '-60%');
            filter.setAttribute('width', '220%');
            filter.setAttribute('height', '220%');
            filter.setAttribute('color-interpolation-filters', 'sRGB');
            const feImg = document.createElementNS(svgns, 'feImage');
            feImg.setAttribute('x', '0');
            feImg.setAttribute('y', '0');
            feImg.setAttribute('width', '100%');
            feImg.setAttribute('height', '100%');
            feImg.setAttribute('preserveAspectRatio', 'none');
            feImg.setAttribute('result', 'dropMap');
            const blur = document.createElementNS(svgns, 'feGaussianBlur');
            blur.setAttribute('in', 'dropMap');
            blur.setAttribute('stdDeviation', '1');
            blur.setAttribute('result', 'dropMapSmooth');
            const disp = document.createElementNS(svgns, 'feDisplacementMap');
            disp.setAttribute('in', 'SourceGraphic');
            disp.setAttribute('in2', 'dropMapSmooth');
            disp.setAttribute('scale', String(waterSettings.displaceScale * 0.65));
            disp.setAttribute('xChannelSelector', 'R');
            disp.setAttribute('yChannelSelector', 'G');
            filter.appendChild(feImg);
            filter.appendChild(blur);
            filter.appendChild(disp);
            globalSvgDefs.appendChild(filter);

            const el = document.createElement('div');
            el.className = 'water-drop';
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.width = boxSize + 'px';
            el.style.height = boxSize + 'px';
            el.style.marginLeft = (-boxSize / 2) + 'px';
            el.style.marginTop = (-boxSize / 2) + 'px';
            el.style.backdropFilter = `url(#${id})`;
            el.style.webkitBackdropFilter = `url(#${id})`;
            document.body.appendChild(el);

            const height = new Float32Array(grid * grid);
            const start = performance.now();
            const duration = 850;
            const cx = grid / 2,
                cy = grid / 2;

            function frame(now) {
                const t = Math.min(1, (now - start) / duration);
                const ringR = t * (grid * 0.46);
                const amp = (1 - t) * 46;
                const spread = 2.6 + t * 3;
                for (let gy = 0; gy < grid; gy++) {
                    for (let gx = 0; gx < grid; gx++) {
                        const r = Math.hypot(gx - cx, gy - cy);
                        const d = r - ringR;
                        height[gy * grid + gx] = amp * Math.exp(-(d * d) / (2 * spread * spread)) * Math.cos(d * 1.1);
                    }
                }
                const url = writeWaterImage(height, grid, grid, canvas, ctx, null);
                if (url) feImg.setAttribute('href', url);

                if (t < 1) {
                    requestAnimationFrame(frame);
                } else {
                    el.remove();
                    filter.remove();
                }
            }
            requestAnimationFrame(frame);
        }

        // ============================================================
        //  RESIZE
        // ============================================================
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (state.page === 'abstract') {
                    const rect = abstractCanvas.parentElement.getBoundingClientRect();
                    const { w, h } = resizeAbstractCanvas();
                    if (abstractShapes.length) {

                if (state.page === 'puzzle' && !puzzleComplete) {

                    loadPuzzleStep(puzzleStep);
                }
                if (state.page === 'puzzle' && puzzleComplete) {
                    if (resetZoomPuzzle) resetZoomPuzzle();
                    loadPuzzleStep(4);
                }
                if (state.page === 'giftpuzzle' && !giftPuzzleComplete) {
                    if (resetZoomGiftPuzzle) resetZoomGiftPuzzle();
                    loadGiftPuzzleStep(giftPuzzleStep);
                }
                if (state.page === 'giftpuzzle' && giftPuzzleComplete) {
                    if (resetZoomGiftPuzzle) resetZoomGiftPuzzle();
                    loadGiftPuzzleStep(3);
                }
            }, 300);
        });

        // ============================================================
        //  INIT
        // ============================================================
        document.addEventListener('click', () => {
            initAudio();
            bgMusic.play().catch(() => {});
        }, { once: true });

        showPage('pageStart');
        document.addEventListener('click', () => {
            bgMusic.play().catch(() => {});
        }, { once: true });

        // Apply initial displacement scale from settings
        updateDisplaceScale(waterSettings.displaceScale);
        waterField.style.opacity = waterSettings.opacity;

        console.log('✦ Подарок ✦');
        console.log('Нажмите Alt+Q (или Alt+Й) для настроек жидкости курсора');
    </script>
</body>
</html>
